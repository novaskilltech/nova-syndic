<body>

  <div class="tiktok-card">
    <video id="vid" src="/ads/tiktok-immeuble-maroc.mp4" loop playsinline muted></video>

    <div class="overlay">
      <div>
        <div class="badge-top">
          <i class="fas fa-building"></i> NOVA SYNDIC MAROC
        </div>
        <div class="hook-text">
          <h1>Gérez votre copropriété <span class="blue">sans stress</span> et en conformité Loi 18-00.</h1>
        </div>
      </div>

      <div class="bottom-section">
        <div class="subtitles-box" id="subBox">
          "Fini les retards de cotisations et les disputes de voisinage."
        </div>
        <a href="https://syndic.novaskill.tech" target="_blank" class="tiktok-cta">
          <span>Tester sur syndic.novaskill.tech</span>
          <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-ctrl" onclick="togglePlay()">
      <i class="fas fa-play" id="iconPlay"></i> <span id="labelPlay">Lancer la pub TikTok</span>
    </button>
    <a href="/ads/tiktok-immeuble-maroc.mp4" download="nova-syndic-tiktok-fr.mp4" class="download-link">
      <i class="fas fa-download"></i> Télécharger le MP4 brut
    </a>
  </div>
  <div style="margin-top: 10px; font-size: 0.85rem;">
    <a href="/ads/tiktok-arabe.html" style="color: #a5b4fc; text-decoration: none;">Voir la version Arabe (العربية الفصحى) &rarr;</a>
  </div>

  <script>
    const lines = [
      "Fini les retards de cotisations et les disputes de voisinage.",
      "Suivi des paiements Wajibati et rappels WhatsApp en un clic.",
      "Convocations et PV d'Assemblée Générale générés en 30 secondes.",
      "Conforme à 100% avec la Loi marocaine 18-00 sur la copropriété.",
      "Rejoignez Nova Syndic dès maintenant sur syndic.novaskill.tech !"
    ];

    let lineIdx = 0;
    let isPlaying = false;
    let speechTimer = null;
    const vid = document.getElementById('vid');

    function speakNext() {
      if (!isPlaying) return;
      const text = lines[lineIdx];
      document.getElementById('subBox').innerText = `"${text}"`;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'fr-FR';
        utter.rate = 1.0;
        utter.pitch = 1.0;
        utter.onend = () => {
          if (isPlaying) {
            lineIdx = (lineIdx + 1) % lines.length;
            speechTimer = setTimeout(speakNext, 800);
          }
        };
        window.speechSynthesis.speak(utter);
      }
    }

    function togglePlay() {
      if (isPlaying) {
        isPlaying = false;
        vid.pause();
        clearTimeout(speechTimer);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('iconPlay').className = 'fas fa-play';
        document.getElementById('labelPlay').innerText = 'Reprendre';
      } else {
        isPlaying = true;
        vid.play();
        document.getElementById('iconPlay').className = 'fas fa-pause';
        document.getElementById('labelPlay').innerText = 'Pause';
        speakNext();
      }
    }
  </script>
</body>
